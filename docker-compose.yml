version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: frtd_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: frtd_influxdb
    ports:
      - "8085:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORGANIZATION}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: frtd_worker
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m services.market_data_worker"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - INFLUXDB_URL=http://influxdb:8086
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy

volumes:
  postgres_data:
  influxdb_data: